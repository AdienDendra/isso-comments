[general]
dbpath = /db/comments.db
# Menggunakan format multi-line list agar Isso menerima request dari kedua domain
host =
    https://architect.adiendendra.com/
    https://issocomment.adiendendra.com/
notify = smtp
max-age = 0
reply-to-self = true

[smtp]
host = smtp.gmail.com
port = 587
security = starttls
timeout = 10
username = adien.dendra@gmail.com
password = %(ISSO_SMTP_PASSWORD)s 
from = "Isso Comments" <adien.dendra@gmail.com>
to = hello@adiendendra.com

[server]
listen = http://0.0.0.0:8080
public-endpoint = https://issocomment.adiendendra.com
ssl = false

[moderation]
enabled = true

[admin]
enabled = true
password = %(ISSO_ADMIN_PASSWORD)s

[guard]
enabled = true
require-author = false
require-email = false
